spring:
  application:
    name: flowdesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  cache:
    # Explicit rather than relying on classpath auto-detection - makes it
    # obvious from this file alone that CacheConfig's RedisCacheConfiguration
    # bean is actually in play, not silently ignored in favor of some
    # other cache provider ending up on the classpath later.
    type: redis
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never auto-generate DDL,
      # even in dev - migrations are the single source of truth.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    # bootstrap-servers itself is set per-profile (application-dev.yml has
    # a localhost fallback; application-prod.yml requires
    # KAFKA_BOOTSTRAP_SERVERS and fails fast without it - the same
    # fail-fast-in-prod treatment as the JWT secret and Redis host).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Each @KafkaListener sets its own groupId explicitly (one per
      # consumer - notification and audit must each see every event
      # independently, which requires separate consumer groups, not one
      # shared group that would split events between them). This default
      # only covers anything that ever forgets to.
      group-id: flowdesk-default
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # ErrorHandlingDeserializer wraps the real deserializer so a
        # malformed/unexpected record fails that one record (logged and
        # skipped by the container's default error handler) instead of
        # killing the whole listener container - one bad message on the
        # topic shouldn't stop every future event from being consumed.
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Every concrete event type lives in ticket.event/comment.event -
        # a whitelist, not "*", so this consumer only ever instantiates
        # classes FlowDesk itself defined from a JSON payload.
        spring.json.trusted.packages: com.flowdesk.*

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Distributed (Redis-backed - see ratelimit.RateLimiterService) fixed-
  # window rate limits per client IP, applied only to /api/auth/** by
  # ratelimit.AuthRateLimitFilter. login/refresh are the more permissive
  # ones since a legitimate user can retry a typo'd password or refresh
  # from several open tabs; register is the tightest since it's the
  # cheapest way to spam-create organizations.
  rate-limit:
    register:
      capacity: 5
      window: 10m
    login:
      capacity: 10
      window: 1m
    refresh:
      capacity: 30
      window: 1m
  # Cron expressions (standard 6-field Spring form: sec min hour day month
  # weekday) for the scheduled jobs added in Phase 9 - see
  # OverdueTicketCheckJob/RefreshTokenCleanupJob. Configurable per
  # environment rather than hardcoded so, e.g., a staging environment
  # could run the overdue check more often without a code change.
  scheduling:
    overdue-ticket-check-cron: "0 0 * * * *" # hourly, on the hour
    refresh-token-cleanup-cron: "0 0 3 * * *" # daily at 03:00

management:
  endpoints:
    web:
      exposure:
        # Only safe, non-sensitive endpoints are exposed by default.
        # Anything broader (env, beans, etc.) must be opted into per-profile
        # and protected - never opened up just for local convenience.
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    # correlationId is populated by a request filter added in a later phase
    # (see common/CorrelationIdFilter) via MDC.
    level: "%5p [%X{correlationId:-}]"
