spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flowdesk}
    username: ${DB_USERNAME:flowdesk}
    password: ${DB_PASSWORD:flowdesk}
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-do-not-use-in-prod}
  rate-limit:
    register:
      capacity: 1000
      window: 10m
    login:
      capacity: 1000
      window: 1m
    refresh:
      capacity: 1000
      window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans

logging:
  level:
    com.flowdesk: DEBUG
    org.hibernate.SQL: DEBUG
