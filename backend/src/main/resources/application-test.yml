spring:
  flyway:
    enabled: true
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:test-only-insecure-jwt-signing-secret-do-not-use-in-prod}
  rate-limit:
    register:
      capacity: 1000
      window: 10m
    login:
      capacity: 1000
      window: 1m
    refresh:
      capacity: 1000
      window: 1m

logging:
  level:
    com.flowdesk: INFO
    org.hibernate.SQL: WARN
