services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flowdesk}
      POSTGRES_USER: ${DB_USERNAME:-flowdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowdesk}
    ports:
      # Host port defaults to 5433 to avoid clashing with a locally
      # installed PostgreSQL service that may already own 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - flowdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flowdesk} -d ${DB_NAME:-flowdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowdesk-redis
    restart: unless-stopped
    ports:
      # Host port defaults to 6380 to avoid clashing with a locally
      # installed Redis service that may already own 6379 (same reasoning
      # as Postgres's 5433 above).
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - flowdesk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka is added in Phase 8, once the application code that actually
  # depends on it exists. Standing up infrastructure ahead of the code
  # that uses it makes it impossible to tell, by looking at this file's
  # history, which phase introduced what.

volumes:
  flowdesk-postgres-data:
  flowdesk-redis-data:
